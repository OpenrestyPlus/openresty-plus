pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          printf 'Go files need formatting:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: go-vet
      run: go vet ./...

pre-push:
  jobs:
    - name: go-test
      run: go test ./...
