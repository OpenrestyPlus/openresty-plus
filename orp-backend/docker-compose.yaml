name: openresty-plus

services:
  mysql:
    container_name: openresty-plus-mysql
    image: mysql:8.4
    network_mode: host
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openresty-plus}
      MYSQL_USER: ${MYSQL_USER:-openresty-plus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openresty-plus-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openresty-plus-root}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    container_name: openresty-plus-redis
    image: redis:7.4-alpine
    network_mode: host
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    container_name: openresty-plus-kafka
    image: apache/kafka:3.9.1
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  openresty-east-1:
    container_name: openresty-plus-openresty-east-1
    network_mode: host
    build:
      context: ./deploy/openresty
      dockerfile: Dockerfile.control-api
    hostname: openresty-east-1
    environment:
      RUNTIME_CONTROL_PLANE_URL: http://127.0.0.1:8081
      RUNTIME_CENTER_ID: c62981ca-9bb7-4ab4-b871-5c9943efe84d
      RUNTIME_POLL_INTERVAL_SECONDS: 5
      RUNTIME_HTTP_PORT: 18080
      CONTROL_API_BRIDGE_PORT: 18081
      NODE_REGISTRATION_ENABLED: "false"
      NODE_NAME: openresty-east-1
      NODE_HOST: 127.0.0.1
      NODE_SERVICE_PORT: 18080
      NODE_CONTROL_API_URL: http://127.0.0.1:18081
    volumes:
      - ../runtime/native-config:/etc/openresty/generated
      - ../runtime/openresty-east-1/log:/var/log/nginx

  openresty-east-2:
    container_name: openresty-plus-openresty-east-2
    build:
      context: ./deploy/openresty
      dockerfile: Dockerfile.control-api
    hostname: openresty-east-2
    ports:
      - "127.0.0.1:18180:18080"
      - "127.0.0.1:18181:18081"
      - "127.0.0.1:18182:18082"
    environment:
      RUNTIME_HTTP_PORT: 18080
      CONTROL_API_BRIDGE_PORT: 18081
      NODE_REGISTRATION_ENABLED: "false"
      NODE_NAME: openresty-east-2
      NODE_HOST: 127.0.0.1
      NODE_SERVICE_PORT: 18180
      NODE_CONTROL_API_URL: http://127.0.0.1:18181
    volumes:
      - ../runtime/native-config-east-2:/etc/openresty/generated
      - ../runtime/openresty-east-2/log:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  openresty-east-3:
    container_name: openresty-plus-openresty-east-3
    build:
      context: ./deploy/openresty
      dockerfile: Dockerfile.control-api
    hostname: openresty-east-3
    ports:
      - "127.0.0.1:18280:18080"
      - "127.0.0.1:18281:18081"
      - "127.0.0.1:18282:18082"
    environment:
      RUNTIME_HTTP_PORT: 18080
      CONTROL_API_BRIDGE_PORT: 18081
      NODE_REGISTRATION_ENABLED: "false"
      NODE_NAME: openresty-east-3
      NODE_HOST: 127.0.0.1
      NODE_SERVICE_PORT: 18280
      NODE_CONTROL_API_URL: http://127.0.0.1:18281
    volumes:
      - ../runtime/native-config-east-3:/etc/openresty/generated
      - ../runtime/openresty-east-3/log:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  filebeat-east-1:
    container_name: openresty-plus-filebeat-east-1
    network_mode: host
    build:
      context: ./deploy/filebeat
    environment:
      FILEBEAT_NODE_ID: ${FILEBEAT_EAST_1_NODE_ID:-}
      FILEBEAT_NODE_NAME: openresty-east-1
      FILEBEAT_KAFKA_HOSTS: ${OPENRESTY_KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      FILEBEAT_KAFKA_TOPIC: ${OPENRESTY_KAFKA_TOPIC:-dtl-602-openresty-plus}
    volumes:
      - ../runtime/openresty-east-1/log:/var/log/nginx:ro
    depends_on:
      - openresty-east-1

  filebeat-east-2:
    container_name: openresty-plus-filebeat-east-2
    network_mode: host
    build:
      context: ./deploy/filebeat
    environment:
      FILEBEAT_NODE_ID: ${FILEBEAT_EAST_2_NODE_ID:-}
      FILEBEAT_NODE_NAME: openresty-east-2
      FILEBEAT_KAFKA_HOSTS: ${OPENRESTY_KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      FILEBEAT_KAFKA_TOPIC: ${OPENRESTY_KAFKA_TOPIC:-dtl-602-openresty-plus}
    volumes:
      - ../runtime/openresty-east-2/log:/var/log/nginx:ro
    depends_on:
      - openresty-east-2

  filebeat-east-3:
    container_name: openresty-plus-filebeat-east-3
    network_mode: host
    build:
      context: ./deploy/filebeat
    environment:
      FILEBEAT_NODE_ID: ${FILEBEAT_EAST_3_NODE_ID:-}
      FILEBEAT_NODE_NAME: openresty-east-3
      FILEBEAT_KAFKA_HOSTS: ${OPENRESTY_KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      FILEBEAT_KAFKA_TOPIC: ${OPENRESTY_KAFKA_TOPIC:-dtl-602-openresty-plus}
    volumes:
      - ../runtime/openresty-east-3/log:/var/log/nginx:ro
    depends_on:
      - openresty-east-3

  deploy-tools:
    container_name: openresty-plus-deploy-tools
    network_mode: host
    build:
      context: ./deploy
    profiles: ["tools"]
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]

volumes:
  mysql-data:
  redis-data:
  kafka-data:
