name: Go control plane checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Verify OpenAPI methods map to Go routes
        run: go run ./cmd/openapi-check
